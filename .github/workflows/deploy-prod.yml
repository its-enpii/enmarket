name: Deploy Production (sim-sppg)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (build on server)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.177.95.92
          username: enpii
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/enpii/studio/enmarket
            git pull --ff-only origin main
            docker compose -f infra/docker-compose.prod.yml --env-file .env build
            docker compose -f infra/docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
            echo "=== stack status ==="
            docker compose -f infra/docker-compose.prod.yml --env-file .env ps
