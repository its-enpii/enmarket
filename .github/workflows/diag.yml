name: SSH Diagnostics (one-shot)
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose web/TLS on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.177.95.92
          username: enpii
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== uptime ==="; uptime
            echo "=== disk ==="; df -h / | tail -1
            echo "=== memory ==="; free -m | head -2
            echo "=== containers ==="
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
            echo "=== compose ps ==="
            cd /home/enpii/studio/enmarket
            docker compose -f infra/docker-compose.prod.yml --env-file .env ps
            echo "=== compose logs (web/nginx, last 30) ==="
            docker compose -f infra/docker-compose.prod.yml --env-file .env logs --tail 30 web nginx 2>&1 | tail -60
